# Render Blueprint - cria o serviço web na plataforma gratuita.
# Basta conectar este repositório no Render (New -> Blueprint).
services:
  - type: web
    name: photoapp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: PHOTOAPP_MAX_DIM
        value: "2400"
      - key: PHOTOAPP_UPSCALE
        value: "2"
      # --- Modo IA automático (Replicate) ---
      # Defina o token no painel do Render (Environment). Sem token, o app
      # funciona normalmente no modo grátis (Telea local).
      - key: REPLICATE_API_TOKEN
        sync: false
      # Motor de pintura (inpainting generativo) usado pelo Auto.
      - key: REPLICATE_MODEL_FILL
        value: "black-forest-labs/flux-fill-pro"
      # Motor de remoção pura (o Auto encadeia: apagar -> refinar).
      - key: REPLICATE_MODEL_ERASER
        value: "bria/eraser"
      # Teto de chamadas pagas por pedido no modo Auto.
      - key: AUTO_MAX_CALLS
        value: "2"
      # Early-stop: não gasta a 2ª chamada paga se a 1ª já vier boa.
      - key: AUTO_EARLY_STOP_SCORE
        value: "0.12"
      # Acima disso a edição é considerada "não limpa".
      - key: AUTO_RESIDUAL_THRESHOLD
        value: "0.18"
      - key: PHOTOAPP_AI_MAX_DIM
        value: "1600"
      # Cache LRU da detecção de marca d'água (0 desliga).
      - key: PHOTOAPP_DETECT_CACHE
        value: "20"