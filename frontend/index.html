<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>PhotoApp - Edição Cirúrgica de Fotos</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="Remova marca d'água, melhore iluminação e resolução das suas fotos sem alterar a fisionomia das pessoas." />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PhotoApp" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Tailwind (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { fontFamily: { sans: ["system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"] } } },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="min-h-screen text-slate-100 antialiased font-sans">
    <div class="mx-auto flex min-h-screen max-w-md flex-col">
      <!-- Top bar -->
      <header class="sticky top-0 z-40 flex items-center justify-between px-4 pt-4 pb-2 backdrop-blur-md bg-slate-950/50 border-b border-white/5">
        <div class="flex items-center gap-2.5">
          <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-sky-400 to-violet-500 shadow-lg shadow-sky-500/20">
            <svg viewBox="0 0 24 24" class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 5h-3.5l-1.5-2h-6L7.5 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z" />
              <circle cx="12" cy="13" r="3.5" />
            </svg>
          </div>
          <div>
            <h1 class="text-base font-semibold leading-none">PhotoApp</h1>
            <p class="text-[11px] text-slate-400">Edição cirúrgica · 100% fiel</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span id="engineBadge" class="hidden rounded-full bg-emerald-500/15 px-2.5 py-1 text-[11px] font-medium text-emerald-300"></span>
          <button id="btnInstall" class="hidden rounded-full bg-gradient-to-r from-sky-500 to-violet-500 px-3 py-1.5 text-xs font-semibold text-white shadow-lg active:scale-95 transition">
            Instalar
          </button>
          <button id="btnNew" class="rounded-full bg-slate-800 px-3 py-1.5 text-xs font-medium text-slate-200 active:scale-95 transition">
            Nova
          </button>
        </div>
      </header>

      <main class="flex flex-1 flex-col px-4 pb-4">
        <!-- ETAPA 1: upload -->
        <section id="uploadView" class="flex flex-1 flex-col items-center justify-center py-8">
          <button
            id="tapZone"
            class="group flex w-full flex-1 flex-col items-center justify-center gap-4 rounded-3xl border-2 border-dashed border-slate-700 bg-slate-900/40 p-8 text-center transition active:scale-[0.99] active:border-sky-500"
          >
            <div class="grid h-20 w-20 place-items-center rounded-full bg-gradient-to-br from-sky-400/20 to-violet-500/20 ring-1 ring-sky-400/30 transition group-active:scale-95">
              <svg viewBox="0 0 24 24" class="h-9 w-9 text-sky-300" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </div>
            <div>
              <p class="text-lg font-semibold">Toque para escolher uma foto</p>
              <p class="mt-1 text-sm text-slate-400">Abre a galeria do celular</p>
            </div>
            <div class="mt-2 flex flex-wrap justify-center gap-2 text-[11px] text-slate-400">
              <span class="rounded-full bg-slate-800/80 px-3 py-1">Remover Marca d'Água</span>
              <span class="rounded-full bg-slate-800/80 px-3 py-1">Melhorar Iluminação</span>
              <span class="rounded-full bg-slate-800/80 px-3 py-1">Melhorar Resolução</span>
            </div>
          </button>
        </section>

        <!-- ETAPA 2: editor -->
        <section id="editorView" class="hidden flex-1 flex-col">
          <div id="stage" class="relative flex min-h-0 flex-1 items-center justify-center overflow-hidden rounded-2xl bg-black/50 ring-1 ring-slate-800">
            <img id="stageImg" class="stage-media" alt="Foto carregada" />
            <canvas id="maskCanvas" class="hidden"></canvas>

            <div id="overlayHint" class="pointer-events-none absolute left-3 top-3 hidden rounded-full bg-amber-400/95 px-3 py-1 text-[11px] font-semibold text-slate-900 shadow">
              Pinte a marca d'água
            </div>

            <!-- Chip de resolução -->
            <div id="resLabel" class="pointer-events-none absolute bottom-3 left-3 rounded-full bg-black/60 px-2.5 py-1 text-[10px] font-medium text-slate-200 backdrop-blur"></div>

            <!-- Comparar antes/depois (segurar) -->
            <button id="btnCompare" class="absolute bottom-3 right-3 rounded-full bg-black/60 px-3 py-2 text-[11px] font-medium text-slate-100 backdrop-blur active:scale-95 disabled:opacity-40">
              Ver original
            </button>
          </div>

          <!-- Barra do pincel -->
          <div id="brushToolbar" class="mt-3 hidden items-center gap-2 rounded-2xl bg-slate-900/70 p-2.5 ring-1 ring-slate-800">
            <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0 text-sky-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20s.5-2 2-3.5S9 14 9 14l7-7 3 3-7 7s-.5 1.5-2 3-6 0-6 0Z" />
            </svg>
            <input id="brushSize" type="range" min="8" max="120" value="40" class="h-1.5 flex-1" />
            <button id="brushUndo" class="rounded-xl bg-slate-800 px-2.5 py-1.5 text-xs active:scale-95">↶</button>
            <button id="brushClear" class="rounded-xl bg-slate-800 px-2.5 py-1.5 text-xs active:scale-95">Limpar</button>
            <button id="brushCancel" class="rounded-xl bg-slate-800 px-2.5 py-1.5 text-xs active:scale-95">Cancelar</button>
          </div>

          <!-- Intensidade + formato -->
          <div class="mt-3 flex items-center gap-3 px-1">
            <span class="text-[11px] font-medium text-slate-400">Luz</span>
            <input id="strength" type="range" min="0" max="2" step="0.1" value="1" class="h-1.5 flex-1" />
            <span id="strengthValue" class="w-9 text-right text-[11px] font-semibold text-sky-300">1.0x</span>
            <select id="formatSelect" class="rounded-lg bg-slate-800 px-2 py-1 text-[11px] text-slate-200 outline-none ring-1 ring-slate-700">
              <option value="image/jpeg">JPG</option>
              <option value="image/png">PNG</option>
            </select>
          </div>
        </section>
      </main>

      <!-- Barra de ações -->
      <footer class="sticky bottom-0 z-40 bg-slate-950/75 px-4 pt-3 safe-bottom backdrop-blur-md border-t border-white/5">
        <div class="grid grid-cols-3 gap-2">
          <button id="btnWatermark" class="flex flex-col items-center gap-1.5 rounded-2xl bg-slate-900 py-3 text-[11px] font-medium ring-1 ring-slate-800 transition active:scale-95 disabled:opacity-40">
            <svg viewBox="0 0 24 24" class="h-5 w-5 text-amber-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18M10.5 5H20a1 1 0 0 1 1 1v13M4 5l16 16" />
            </svg>
            <span data-label>Remover Marca d'Água</span>
          </button>

          <button id="btnLighting" class="flex flex-col items-center gap-1.5 rounded-2xl bg-slate-900 py-3 text-[11px] font-medium ring-1 ring-slate-800 transition active:scale-95 disabled:opacity-40">
            <svg viewBox="0 0 24 24" class="h-5 w-5 text-sky-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <span data-label>Melhorar Iluminação</span>
          </button>

          <button id="btnUpscale" class="flex flex-col items-center gap-1.5 rounded-2xl bg-slate-900 py-3 text-[11px] font-medium ring-1 ring-slate-800 transition active:scale-95 disabled:opacity-40">
            <svg viewBox="0 0 24 24" class="h-5 w-5 text-violet-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
            <span data-label>Melhorar Resolução</span>
          </button>
        </div>

        <div class="mt-2 grid grid-cols-2 gap-2 pb-1">
          <button id="btnReset" class="rounded-2xl bg-slate-900 py-2.5 text-xs font-medium text-slate-300 ring-1 ring-slate-800 active:scale-95 disabled:opacity-40">
            Desfazer
          </button>
          <button id="btnDownload" class="rounded-2xl bg-gradient-to-r from-sky-500 to-violet-500 py-2.5 text-xs font-semibold text-white shadow-lg active:scale-95">
            Salvar na galeria
          </button>
        </div>
      </footer>
    </div>

    <!-- Input de arquivo escondido -->
    <input id="fileInput" type="file" accept="image/*" class="hidden" />

    <!-- Overlay de carregamento -->
    <div id="loading" class="fixed inset-0 z-[70] hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm">
      <div class="flex flex-col items-center gap-4 rounded-3xl bg-slate-900/80 px-8 py-7 ring-1 ring-slate-700">
        <div class="spinner"></div>
        <p id="loadingText" class="text-sm font-medium text-slate-200">Processando...</p>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-[80] opacity-0 translate-y-4"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
